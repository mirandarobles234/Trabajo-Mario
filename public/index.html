<!doctype html>
<html lang="es">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Brick Vault</title>
    <link rel="icon" href="data:image/svg+xml,<svg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 100 100'><text y='.9em' font-size='90'>🧱</text></svg>">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600;700&amp;family=Nunito:wght@400;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="/styles.css">
  </head>
  <body>
    <div class="app arriba">
      <!-- Barra de navegación: JavaScript agrega un botón por cada sección. -->
      <header class="barra">
        <p class="marca-nombre">Brick Vault</p>
        <nav id="menu" aria-label="Secciones"></nav>
      </header>

      <main>
        <div class="encabezado">
          <div>
            <h1 id="titulo"></h1>
            <p id="ayuda"></p>
          </div>
          <button id="btn-nuevo" class="btn primario" type="button"></button>
        </div>

        <!-- Tabla donde se dibujan los datos que devuelve FastAPI. -->
        <div class="tabla-caja">
          <table>
            <thead id="cabeza"></thead>
            <tbody id="cuerpo"></tbody>
          </table>
          <p id="vacio" class="vacio" hidden></p>
        </div>
      </main>
    </div>

    <!-- Ventana con el formulario para registrar o editar. -->
    <dialog id="dlg-form" class="ventana">
      <form id="form" novalidate>
        <h2 id="form-titulo"></h2>
        <div id="form-campos" class="campos"></div>
        <p id="form-error" class="error" role="alert" hidden></p>
        <div class="acciones-form">
          <button type="button" class="btn" id="form-cancelar">Cancelar</button>
          <button type="submit" class="btn primario" id="form-guardar"></button>
        </div>
      </form>
    </dialog>

    <!-- Mensajes cortos de confirmación o error. -->
    <p id="aviso" class="aviso" role="status" hidden></p>

    <script src="/app.js"></script>
  </body>
</html>
